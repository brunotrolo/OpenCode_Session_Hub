name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used to read opencode.db) needs Node 22.5+.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: node --test "out/test/*.test.js"
